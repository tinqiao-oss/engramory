name: Bug report
description: Something in the hooks, the dsh plugin, the installer, or the tools isn't behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security-sensitive** issues do NOT file here —
        see [SECURITY.md](https://github.com/tinqiao-oss/engramory/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs. what you got. Paste the exact command and its output.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hook — Claude Code (engramory_index_guard.py)
        - hook — Codex (hooks/codex)
        - dsh plugin (dsh-engramory)
        - installer — engramory_init.py (incl. --uninstall)
        - tool — engramory_doctor.py
        - tool — engramory_check.py
        - tool — engramory_sync.py / engramory_trace.py
        - protocol text (SKILL.md / rules-snippet.md)
        - docs / templates
        - other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host / agent
      description: e.g. Claude Code, Codex, dsh (DeepSeek Harness), Cursor, Kiro, or a plain script — with its version.
      placeholder: dsh 0.2.1-rc.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: "`python --version` for the hooks and tools; `node --version` and the dsh-engramory version for the dsh plugin."
      placeholder: "Python 3.12.3 / Node 24.11.1 + dsh-engramory 0.2.7"
    validations:
      required: true
  - type: textarea
    id: hook_payload
    attributes:
      label: For a HOOK or dsh-plugin bug — the tool call + index state
      description: >
        The `tool_input` JSON the hook received (for the dsh plugin: the tool name and its
        arguments), plus the index it was gating (line count / bytes of MEMORY.md, and
        whether it is a symlink or a special file). This is what makes a gating bug reproducible.
      render: json
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: The smallest steps / files that trigger it.
    validations:
      required: false
