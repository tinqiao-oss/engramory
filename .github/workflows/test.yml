name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # No dependencies — the suites run as plain scripts (exit non-zero on failure).
      - name: hook tests
        run: python tests/test_index_guard.py
      - name: tool tests
        run: python tests/test_tools.py
      # Concurrency semantics differ per platform (POSIX flock vs Windows msvcrt),
      # so this one earns its place in the matrix rather than a local run.
      - name: state-lock tests
        run: python tests/test_state_lock.py
      - name: codex hook tests
        run: python tests/test_codex_hooks.py
      - name: codex installer tests
        run: python tests/test_codex_init.py
      - name: protocol-text tests
        run: python tests/test_protocol_sync.py
      # Runs the plugin's own `node --test` decision table (node ships on all three
      # runner images); skips gracefully where node is absent.
      - name: dsh plugin tests
        run: python tests/test_dsh_plugin.py
